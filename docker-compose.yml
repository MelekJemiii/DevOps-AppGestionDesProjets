name: gestion
services:

  mysql:
    image: mysql:8.0
    container_name: gestion-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - gestion-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    image: gestion-backend
    container_name: gestion-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gestion_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8089:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    networks:
      - gestion-net

  frontend:
    build: ./frontend
    image: gestion-frontend
    container_name: gestion-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - gestion-net

volumes:
  mysql-data:

networks:
  gestion-net:
    driver: bridge
