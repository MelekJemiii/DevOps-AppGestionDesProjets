server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls -> backend container (Docker network)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
    }

    # Angular routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
